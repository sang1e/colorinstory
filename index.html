<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퍼스널컬러 진단 결과 | 컬러인에듀센터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#FFF9F5;color:#2C2218;min-height:100vh;}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#fff;border-bottom:0.5px solid rgba(196,92,48,0.15);position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-ring{width:32px;height:32px;border-radius:50%;background:conic-gradient(#e87c5a,#f9c74f,#90be6d,#4cc9f0,#7b2d8b,#e87c5a);display:flex;align-items:center;justify-content:center;}
.logo-ring span{font-size:13px;font-weight:700;color:#fff;font-family:serif;}
.logo-name{font-size:13px;font-weight:500;color:#1a2744;}
.logo-sub{font-size:10px;color:#8C6040;letter-spacing:0.5px;}
.header-badge{font-size:11px;padding:4px 12px;border-radius:20px;font-weight:500;}

.hero{padding:40px 24px 32px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-50px;right:-50px;width:220px;height:220px;border-radius:50%;opacity:0.35;}
.hero::after{content:'';position:absolute;bottom:-30px;left:-20px;width:140px;height:140px;border-radius:50%;opacity:0.3;}
.hero-tag{display:inline-block;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;padding:5px 16px;border-radius:20px;margin-bottom:14px;font-weight:500;position:relative;z-index:1;}
.hero-name{font-family:'Cormorant Garamond',serif;font-size:15px;margin-bottom:4px;position:relative;z-index:1;}
.hero-season{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:600;color:#1a2744;line-height:1.1;position:relative;z-index:1;}
.hero-season-en{font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;margin-top:4px;position:relative;z-index:1;}
.hero-chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1;}
.hero-chip{border:0.5px solid;border-radius:20px;padding:5px 14px;font-size:11px;}

.tab-nav{display:flex;overflow-x:auto;background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.08);padding:0 16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tab-nav::-webkit-scrollbar{display:none;}
.tab-btn{padding:12px 16px;font-size:12px;color:#aaa;border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all 0.2s;font-family:'Noto Sans KR',sans-serif;}
.tab-btn.active{font-weight:500;border-bottom-color:currentColor;}

.page{display:none;padding:20px 20px 90px;}
.page.active{display:block;}

.sec-title{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;font-weight:500;padding:20px 0 12px;display:flex;align-items:center;gap:10px;}
.sec-title::after{content:'';flex:1;height:0.5px;background:currentColor;opacity:0.2;}

.card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
.card-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:500;margin-bottom:10px;}

.palette-wrap{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-bottom:6px;}
.swatch{aspect-ratio:1;border-radius:8px;border:0.5px solid rgba(0,0,0,0.07);}

.desc{font-size:13px;line-height:1.85;color:#4a3828;}
.desc strong{font-weight:500;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{padding:5px 13px;border-radius:20px;font-size:11px;border:0.5px solid;}

.tone-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tone-card{background:#fffbf8;border:0.5px solid rgba(0,0,0,0.08);border-radius:12px;padding:14px;}
.tone-dots{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
.tone-dot{width:34px;height:34px;border-radius:50%;border:0.5px solid rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;}
.tone-note{font-size:11px;color:#8C6040;line-height:1.6;}

.fashion-palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;}

.beauty-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.b-swatches{display:flex;gap:5px;flex-wrap:wrap;}
.b-dot{width:30px;height:30px;border-radius:7px;border:0.5px solid rgba(0,0,0,0.08);}

.hair-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.hair-item{border-radius:8px;overflow:hidden;border:0.5px solid rgba(0,0,0,0.07);}
.hair-bar{height:44px;width:100%;}
.hair-lbl{padding:4px;font-size:8px;text-align:center;color:#6a5040;background:#fffbf8;line-height:1.3;}

.metal-list{display:flex;flex-wrap:wrap;gap:8px;}
.metal-chip{display:flex;align-items:center;gap:7px;background:#fffbf8;border:0.5px solid rgba(0,0,0,0.1);border-radius:20px;padding:7px 13px;font-size:12px;color:#4a3828;}
.metal-dot{width:14px;height:14px;border-radius:50%;border:0.5px solid rgba(0,0,0,0.1);flex-shrink:0;}

.eye-list{display:flex;flex-direction:column;gap:8px;}
.eye-item{display:flex;align-items:center;gap:12px;padding:10px 13px;background:#fffbf8;border:0.5px solid rgba(0,0,0,0.08);border-radius:10px;}
.eye-color{width:34px;height:34px;border-radius:8px;flex-shrink:0;border:0.5px solid rgba(0,0,0,0.08);}
.eye-name{font-size:13px;font-weight:500;color:#1a2744;}
.eye-desc{font-size:11px;color:#8C6040;margin-top:2px;}

.contact-hero{background:#1a2744;border-radius:14px;padding:26px 20px;text-align:center;color:#fff;margin-bottom:12px;}
.contact-quote{font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;margin-bottom:18px;line-height:1.7;}
.contact-brand{font-size:15px;font-weight:500;letter-spacing:1px;margin-bottom:18px;}
.contact-items{display:flex;flex-direction:column;gap:10px;}
.contact-item{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#c8d4e8;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:0.5px solid rgba(0,0,0,0.1);z-index:100;}
.bnav-btn{flex:1;padding:10px 4px 8px;text-align:center;font-size:9px;color:#ccc;cursor:pointer;border:none;background:none;font-family:'Noto Sans KR',sans-serif;}
.bnav-btn.active{font-weight:500;}
.bnav-icon{font-size:20px;display:block;margin-bottom:2px;}

/* 에러 페이지 */
.error-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:40px 24px;text-align:center;}
.error-icon{font-size:48px;margin-bottom:16px;}
.error-title{font-size:20px;font-weight:500;color:#1a2744;margin-bottom:8px;}
.error-desc{font-size:13px;color:#8C6040;line-height:1.7;}
</style>

</div>
