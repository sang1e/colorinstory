<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 | 컬러인에듀센터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#f5f5f0;color:#1a2744;min-height:100vh;}
.wrap{max-width:600px;margin:0 auto;padding:0 0 40px;}

.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#1a2744;color:#fff;}
.top-left{display:flex;align-items:center;gap:10px;}
.top-logo{width:32px;height:32px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;color:#1a2744;font-size:13px;}
.top-title{font-size:14px;font-weight:500;}
.top-sub{font-size:10px;color:#8899cc;margin-top:1px;}
.admin-tag{font-size:10px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,0.15);color:#c8d4e8;}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#e0ddd8;border-bottom:1px solid #e0ddd8;}
.stat{background:#fff;padding:16px;text-align:center;}
.stat-num{font-size:24px;font-weight:500;color:#1a2744;}
.stat-lbl{font-size:11px;color:#8090b0;margin-top:3px;}

.main{padding:20px;}

.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;border:0.5px solid #e0ddd8;}
.card-title{font-size:13px;font-weight:500;color:#1a2744;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.card-title svg{width:16px;height:16px;stroke:#8090b0;fill:none;stroke-width:1.5;}

label{display:block;font-size:11px;color:#6a7090;font-weight:500;margin-bottom:6px;}
input,select{width:100%;padding:9px 12px;font-size:13px;border-radius:8px;border:0.5px solid #d0cdc8;background:#fff;color:#1a2744;font-family:'Noto Sans KR',sans-serif;outline:none;}
input:focus,select:focus{border-color:#8899cc;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.form-group{margin-bottom:14px;}

.season-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.s-btn{padding:12px 6px;border-radius:10px;border:0.5px solid #e0ddd8;background:#f9f8f5;cursor:pointer;text-align:center;transition:all 0.15s;}
.s-btn:hover{background:#fff;border-color:#bbb;}
.s-btn.on{border:2px solid;}
.s-dot{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;border:0.5px solid rgba(0,0,0,0.08);}
.s-name{font-size:12px;font-weight:500;color:#1a2744;margin-bottom:2px;}
.s-sub{font-size:9px;color:#8090b0;}
.sp-on{border-color:#C45C30!important;}.su-on{border-color:#5878B8!important;}.au-on{border-color:#A87830!important;}.wi-on{border-color:#405898!important;}

.sub-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.sub-btn{padding:7px 14px;border-radius:20px;border:0.5px solid #e0ddd8;background:#f9f8f5;font-size:12px;color:#6a7090;cursor:pointer;transition:all 0.15s;font-family:'Noto Sans KR',sans-serif;}
.sub-btn:hover{border-color:#bbb;background:#fff;}
.sub-btn.on{background:#fff;border:1.5px solid #1a2744;color:#1a2744;font-weight:500;}

.gen-btn{width:100%;padding:13px;border-radius:10px;background:#1a2744;color:#fff;font-size:14px;font-weight:500;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:opacity 0.15s;}
.gen-btn:hover{opacity:0.88;}
.gen-btn:disabled{opacity:0.35;cursor:not-allowed;}

.result-box{background:#f0f4ff;border:0.5px solid #c0cce8;border-radius:10px;padding:14px;margin-top:14px;display:none;}
.result-box.show{display:block;}
.result-lbl{font-size:11px;color:#6a7090;margin-bottom:8px;}
.link-row{display:flex;gap:8px;}
.link-text{flex:1;padding:9px 12px;background:#fff;border:0.5px solid #d0cdc8;border-radius:8px;font-size:11px;color:#1a2744;word-break:break-all;font-family:monospace;}
.copy-btn{padding:9px 14px;border-radius:8px;border:0.5px solid #d0cdc8;background:#fff;font-size:12px;color:#1a2744;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;}
.copy-btn:hover{background:#f5f5f0;}
.kakao-btn{width:100%;padding:12px;border-radius:10px;background:#FAE100;color:#3c1e00;font-size:13px;font-weight:500;border:none;cursor:pointer;margin-top:8px;font-family:'Noto Sans KR',sans-serif;transition:opacity 0.15s;}
.kakao-btn:hover{opacity:0.9;}

.hist-list{display:flex;flex-direction:column;gap:8px;}
.hist-item{display:flex;align-items:center;gap:12px;padding:11px 13px;background:#f9f8f5;border-radius:9px;border:0.5px solid #e8e5e0;}
.h-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.h-name{font-size:13px;font-weight:500;color:#1a2744;}
.h-meta{font-size:11px;color:#8090b0;margin-top:2px;}
.h-info{flex:1;}
.badge{font-size:10px;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.sent{background:#e8f8e8;color:#2a782a;}
.wait{background:#fff8e0;color:#8a6000;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-left">
      <div class="top-logo">C</div>
      <div>
        <div class="top-title">컬러인에듀센터</div>
        <div class="top-sub">진단 결과 관리</div>
      </div>
    </div>
    <span class="admin-tag">관리자</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="s-total">3</div><div class="stat-lbl">이번달 진단</div></div>
    <div class="stat"><div class="stat-num" id="s-sent">2</div><div class="stat-lbl">발송 완료</div></div>
    <div class="stat"><div class="stat-num" id="s-wait">1</div><div class="stat-lbl">발송 대기</div></div>
  </div>

  <div class="main">
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        새 진단 결과 입력
      </div>

      <div class="form-row">
        <div class="form-group" style="margin:0;">
          <label>고객 이름</label>
          <input type="text" id="inp-name" placeholder="홍길동" />
        </div>
        <div class="form-group" style="margin:0;">
          <label>진단 날짜</label>
          <input type="date" id="inp-date" />
        </div>
      </div>
      <div class="form-group">
        <label>연락처</label>
        <input type="text" id="inp-phone" placeholder="010-0000-0000" />
      </div>

      <label>시즌 선택</label>
      <div class="season-grid">
        <div class="s-btn" id="ss-spring" onclick="pickSeason('spring')">
          <div class="s-dot" style="background:#F9C6BC;"></div>
          <div class="s-name">봄</div><div class="s-sub">Spring Warm</div>
        </div>
        <div class="s-btn" id="ss-summer" onclick="pickSeason('summer')">
          <div class="s-dot" style="background:#B4C8F0;"></div>
          <div class="s-name">여름</div><div class="s-sub">Summer Cool</div>
        </div>
        <div class="s-btn" id="ss-autumn" onclick="pickSeason('autumn')">
          <div class="s-dot" style="background:#D4A060;"></div>
          <div class="s-name">가을</div><div class="s-sub">Autumn Warm</div>
        </div>
        <div class="s-btn" id="ss-winter" onclick="pickSeason('winter')">
          <div class="s-dot" style="background:#8899CC;"></div>
          <div class="s-name">겨울</div><div class="s-sub">Winter Cool</div>
        </div>
      </div>

      <label id="sub-label" style="display:none;">세부 타입</label>
      <div class="sub-row" id="sub-row"></div>

      <button class="gen-btn" id="gen-btn" onclick="generate()" disabled>진단 결과 링크 생성</button>

      <div class="result-box" id="result-box">
        <div class="result-lbl">생성된 고객 전용 링크</div>
        <div class="link-row">
          <div class="link-text" id="result-link"></div>
          <button class="copy-btn" onclick="copyLink()">복사</button>
        </div>
        <button class="kakao-btn" onclick="sendKakao()">💬 카카오톡으로 결과 발송</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        최근 발송 내역
      </div>
      <div class="hist-list" id="hist-list">
        <div class="hist-item">
          <div class="h-dot" style="background:#F9C6BC;"></div>
          <div class="h-info"><div class="h-name">김민지</div><div class="h-meta">봄 라이트 · 2026.05.18</div></div>
          <span class="badge sent">✓ 발송완료</span>
        </div>
        <div class="hist-item">
          <div class="h-dot" style="background:#8899CC;"></div>
          <div class="h-info"><div class="h-name">이서연</div><div class="h-meta">겨울 쿨 · 2026.05.17</div></div>
          <span class="badge sent">✓ 발송완료</span>
        </div>
        <div class="hist-item">
          <div class="h-dot" style="background:#D4A060;"></div>
          <div class="h-info"><div class="h-name">박지현</div><div class="h-meta">가을 웜 · 2026.05.20</div></div>
          <span class="badge wait">대기중</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SITE = 'https://colorinstory.vercel.app';
const subtypes = {
  spring:['라이트 Light','브라이트 Bright','웜 Warm','클리어 Clear'],
  summer:['라이트 Light','브라이트 Bright','뮤트 Mute','쿨 Cool'],
  autumn:['뮤트 Mute','딥 Deep','웜 Warm','스트롱 Strong'],
  winter:['브라이트 Bright','딥 Deep','쿨 Cool','클리어 Clear']
};
const dots={spring:'#F9C6BC',summer:'#B4C8F0',autumn:'#D4A060',winter:'#8899CC'};
const names={spring:'봄',summer:'여름',autumn:'가을',winter:'겨울'};
const cls={spring:'sp-on',summer:'su-on',autumn:'au-on',winter:'wi-on'};
let season=null, subtype=null;

document.getElementById('inp-date').value = new Date().toISOString().slice(0,10);

function pickSeason(s){
  season=s; subtype=null;
  ['spring','summer','autumn','winter'].forEach(k=>{
    const el=document.getElementById('ss-'+k);
    el.className='s-btn'+(k===s?' on '+cls[k]:'');
  });
  const row=document.getElementById('sub-row');
  row.innerHTML=subtypes[s].map(t=>`<button class="sub-btn" onclick="pickSub(this,'${t}')">${t}</button>`).join('');
  document.getElementById('sub-label').style.display='block';
  checkReady();
}

function pickSub(el,t){
  subtype=t;
  document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  checkReady();
}

function checkReady(){
  const ok = document.getElementById('inp-name').value.trim() && season && subtype;
  document.getElementById('gen-btn').disabled = !ok;
}
document.getElementById('inp-name').addEventListener('input', checkReady);

function generate(){
  const name = document.getElementById('inp-name').value.trim();
  const date = document.getElementById('inp-date').value;
  const link = `${SITE}/?name=${encodeURIComponent(name)}&season=${season}&type=${encodeURIComponent(subtype)}&date=${date}`;
  document.getElementById('result-link').textContent = link;
  document.getElementById('result-box').classList.add('show');

  const list = document.getElementById('hist-list');
  const div = document.createElement('div');
  div.className='hist-item';
  div.innerHTML=`<div class="h-dot" style="background:${dots[season]};"></div><div class="h-info"><div class="h-name">${name}</div><div class="h-meta">${names[season]} ${subtype} · ${date.replaceAll('-','.')}</div></div><span class="badge wait">대기중</span>`;
  list.prepend(div);

  document.getElementById('s-total').textContent = +document.getElementById('s-total').textContent+1;
  document.getElementById('s-wait').textContent = +document.getElementById('s-wait').textContent+1;
}

function copyLink(){
  navigator.clipboard.writeText(document.getElementById('result-link').textContent).catch(()=>{});
  const btn=document.querySelector('.copy-btn');
  btn.textContent='복사됨 ✓';
  setTimeout(()=>btn.textContent='복사',2000);
}

function sendKakao(){
  const name=document.getElementById('inp-name').value.trim();
  const first=document.querySelector('.hist-item');
  if(first){
    first.querySelector('.badge').className='badge sent';
    first.querySelector('.badge').textContent='✓ 발송완료';
  }
  const w=document.getElementById('s-wait');
  const s=document.getElementById('s-sent');
  w.textContent=Math.max(0,+w.textContent-1);
  s.textContent=+s.textContent+1;
  alert(`${name}님께 카카오톡 메시지를 발송했습니다.`);
}
</script>
</body>
</html>
